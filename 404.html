<!DOCTYPE html>
<html>
<head>
  <script>
    const path = window.location.pathname;

    if (path.startsWith("/bengali")) {
      window.location.href = "/bengali.html";
    } else if (path.startsWith("/english")) {
      window.location.href = "/english.html";
    } else if (path.startsWith("/hindi")) {
      window.location.href = "/hindi.html";
    } else if (path.startsWith("/kannada")) {
      window.location.href = "/kannada.html";
    } else if (path.startsWith("/malayalam")) {
      window.location.href = "/malayalam.html";
    } else if (path.startsWith("/telugu")) {
      window.location.href = "/telugu.html";
    } else {
      // fallback
      window.location.href = "/";
    }
  </script>
</head>
<body></body>
</html>
